<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../logo/logo.svg">
    <title>Buscar | Nueva Finanza</title>
    <meta name="description" content="Busca artículos en Nueva Finanza.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://www.nuevafinanza.com/buscar/">
    <link rel="stylesheet" href="../css/tailwind.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-display { font-family: 'Sora', sans-serif; }
        .logo-nav img { height: 44px; width: auto; }
    </style>
</head>
<body class="bg-white text-slate-900">
<div class="h-1 bg-emerald-600"></div>
<nav class="sticky top-0 z-50 bg-white border-b-2 border-emerald-600">
    <div class="max-w-6xl mx-auto px-4">
        <div class="flex items-center justify-between h-16 gap-6">
            <div class="logo-nav cursor-pointer flex-shrink-0" onclick="location.href='../index.html'">
                <img src="../logo/logo.svg" alt="Nueva Finanza">
            </div>
            <div class="relative flex-1 max-w-md">
                <input type="text" id="searchInput" placeholder="Buscar..." class="bg-slate-50 rounded-full py-2 px-10 text-xs w-full transition-all outline-none border border-transparent focus:border-emerald-600 focus:bg-white">
                <i data-lucide="search" class="absolute left-4 top-2.5 w-4 h-4 text-slate-400"></i>
            </div>
            <button onclick="location.href='../admin/login/index.html'" class="text-slate-400 hover:text-emerald-700 transition-colors flex-shrink-0" aria-label="Acceso">
                <i data-lucide="circle-user" class="w-5 h-5"></i>
            </button>
        </div>
        <div id="categoryNavBar" class="flex items-center gap-5 overflow-x-auto no-scrollbar pb-3"></div>
    </div>
</nav>
<style>.no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }</style>
<main class="max-w-3xl mx-auto px-4 py-10">
    <h1 class="text-2xl font-display font-bold mb-8">Resultados de búsqueda</h1>
    <div id="results" class="space-y-4">
        <p class="text-slate-400 py-10 text-center">Buscando...</p>
    </div>
</main>
<footer class="bg-slate-900 text-slate-300 mt-20">
    <div class="max-w-7xl mx-auto px-4 py-14">
        <div class="border-t border-slate-700 pt-8 text-center text-xs text-slate-500">
            <p>&copy; <span id="copyright-year">2026</span> Nueva Finanza &middot; Todos los derechos reservados &middot; <a href="../privacidad.html" class="hover:text-white">Privacidad</a> &middot; <a href="../terminos.html" class="hover:text-white">Términos</a></p>
        </div>
    </div>
</footer>
<script src="../js/app.js"></script>
<script>
    lucide.createIcons();
    document.getElementById("copyright-year").textContent = new Date().getFullYear();

    function categorySlug(cat) {
        return cat.toLowerCase()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    }
    function titleSlug(title) {
        return categorySlug(title);
    }

    function renderCategoryNavBar(allNews) {
        const lastDate = {};
        allNews.forEach(n => {
            if (!lastDate[n.category] || n.date > lastDate[n.category]) lastDate[n.category] = n.date;
        });
        const cats = Object.keys(lastDate).sort((a, b) => lastDate[b].localeCompare(lastDate[a]));
        const bar = document.getElementById('categoryNavBar');
        if (bar) {
            bar.innerHTML = cats.map(c => `<a href="../${categorySlug(c)}/" class="text-xs font-bold uppercase tracking-wide text-slate-600 hover:text-emerald-600 whitespace-nowrap transition-colors">${c}</a>`).join('');
        }
    }

    const params = new URLSearchParams(window.location.search);
    const q = (params.get('q') || '').toLowerCase().trim();
    document.getElementById('searchInput').value = q;
    document.getElementById('searchInput').onkeyup = function(e) {
        if (e.key === 'Enter') {
            location.href = '?q=' + encodeURIComponent(this.value);
        }
    };

    fetchNews().then(allNews => {
        renderCategoryNavBar(allNews);
        const results = q
            ? allNews.filter(n =>
                n.title.toLowerCase().includes(q) ||
                (n.content && n.content.toLowerCase().includes(q)) ||
                (n.category && n.category.toLowerCase().includes(q)))
            : [];
        const container = document.getElementById('results');
        if (!q) {
            container.innerHTML = '<p class="text-slate-400 py-10 text-center">Escribe algo para buscar.</p>';
            return;
        }
        container.innerHTML = results.length
            ? results.map(n => `
                <article class="flex gap-4 items-start bg-white rounded-xl border border-slate-100 p-3 hover:border-emerald-200 transition-colors">
                    <a href="../${categorySlug(n.category)}/${titleSlug(n.title)}-${n.id}/" class="flex-shrink-0">
                        <img src="${n.images[0]}" class="w-28 h-20 object-cover rounded-lg" alt="${n.title}" loading="lazy">
                    </a>
                    <div class="min-w-0">
                        <span class="text-emerald-700 font-semibold text-[10px] uppercase tracking-wide">${n.category}</span>
                        <a href="../${categorySlug(n.category)}/${titleSlug(n.title)}-${n.id}/"><h3 class="font-bold mt-1 line-clamp-2 text-slate-800">${n.title}</h3></a>
                    </div>
                </article>`).join('')
            : '<p class="text-slate-400 py-10 text-center">No se encontraron resultados.</p>';
    });
</script>
</body>
</html>

name: Auto-publicar artículos

on:
  schedule:
    # Horarios en UTC. Santo Domingo es UTC-4, así que:
    # 11:00 UTC = 7:00 AM RD  | 13:30 UTC = 9:30 AM RD
    # 16:00 UTC = 12:00 PM RD | 18:30 UTC = 2:30 PM RD
    # 21:00 UTC = 5:00 PM RD  | 23:30 UTC = 7:30 PM RD
    # 01:30 UTC = 9:30 PM RD  | 03:30 UTC = 11:30 PM RD
    - cron: '0 11 * * *'
    - cron: '30 13 * * *'
    - cron: '0 16 * * *'
    - cron: '30 18 * * *'
    - cron: '0 21 * * *'
    - cron: '30 23 * * *'
    - cron: '30 1 * * *'
    - cron: '30 3 * * *'
  workflow_dispatch: {}   # permite correrlo manualmente desde la pestaña "Actions" en GitHub, para probar

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Publicar artículo automático
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: python3 scripts/auto_publish.py
